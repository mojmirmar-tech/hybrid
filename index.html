<!DOCTYPE html>
<html lang="cs">
<head>

<meta name="theme-color" content="#F5F2EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14120F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* ===== v14 design system: tokens, shell, base components ===== */
:root{--ff:Manrope,Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
--bg:#F5F2EB;--bg2:#F1EDE4;--card:#FFFFFF;--ink:#1C1A17;--mut:#666156;--line:#ECE7DD;
--mac:#BD3E0B;--mac2:#FF9A66;--mac3:#FFEADB;
--run:#D1173F;--run2:#FF7A95;--run3:#FFE5EB;
--gym:#2257E0;--gym2:#7BA5FF;--gym3:#E6EDFF;
--brand:#1C1A17;--onacc:#FFFFFF;--ok:#077A4F;--bad:#C4332A;--acc:var(--brand);
--rp:#7C3AED;--rc:#D98A0B;--rf:#0D9488;--rfi:#16A34A;--rct:#A15C07;--rc2:#1A1405;
--sh:0 1px 1px rgba(70,50,20,.04),0 12px 30px -14px rgba(70,50,20,.2);--bd:0 solid transparent;
--navbg:#1D1B18;--navink:#F5F2EB;--chip:rgba(28,26,23,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--bg2:#2A2824;--card:#1F1E1B;--ink:#F4F1EA;--mut:#A39E93;--line:#2E2C28;--mac:#FF9A66;--mac2:#FF9A66;--mac3:#3A2418;--run:#FF7A95;--run2:#FF7A95;--run3:#3C1A24;--gym:#7BA5FF;--gym2:#7BA5FF;--gym3:#1B2740;--brand:#F4F1EA;--onacc:#16130F;--ok:#4CC38F;--bad:#FF8A7D;--rp:#A78BFA;--rc:#F2B544;--rf:#2DD4BF;--rfi:#4ADE80;--rct:#F2B544;--sh:none;--bd:1px solid var(--line);--navbg:#2E2C28;--navink:#F4F1EA;--chip:rgba(244,241,234,.09);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141311;--bg2:#2A2824;--card:#1F1E1B;--ink:#F4F1EA;--mut:#A39E93;--line:#2E2C28;--mac:#FF9A66;--mac2:#FF9A66;--mac3:#3A2418;--run:#FF7A95;--run2:#FF7A95;--run3:#3C1A24;--gym:#7BA5FF;--gym2:#7BA5FF;--gym3:#1B2740;--brand:#F4F1EA;--onacc:#16130F;--ok:#4CC38F;--bad:#FF8A7D;--rp:#A78BFA;--rc:#F2B544;--rf:#2DD4BF;--rfi:#4ADE80;--rct:#F2B544;--sh:none;--bd:1px solid var(--line);--navbg:#2E2C28;--navink:#F4F1EA;--chip:rgba(244,241,234,.09);color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;background:var(--bg);scroll-padding-top:calc(96px + env(safe-area-inset-top,0px));scroll-padding-bottom:120px;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--ff);font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:600px;margin:0 auto;padding:0 18px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 -18px;padding:14px 18px 10px;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.hd-row{display:flex;align-items:center;gap:10px}.hd-l{flex:1;min-width:0}
.hk{font:600 13px var(--ff);color:var(--mut);letter-spacing:.01em}.hk::first-letter{text-transform:uppercase}
.hg{font:800 28px/1.12 var(--ff);letter-spacing:-.035em;margin-top:2px}
.ht{font:800 26px/1.15 var(--ff);letter-spacing:-.035em;display:flex;align-items:center;gap:10px}
.ht i{width:11px;height:11px;border-radius:50%;background:var(--acc);display:inline-block}
.ib{flex:none;width:44px;height:44px;border-radius:16px;border:var(--bd);background:var(--card);box-shadow:var(--sh);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.ib2{flex:none;width:38px;height:38px;border:0;border-radius:12px;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.ib:hover,.ib2:hover{background:var(--bg2)}
.ib svg,.ib2 svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.av{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:800 14px var(--ff);letter-spacing:.02em;cursor:pointer;padding:0;box-shadow:var(--sh)}
.av svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.lgb{height:36px;padding:0 13px;border:var(--bd);border-radius:999px;background:var(--card);box-shadow:var(--sh);color:var(--mut);font:800 12px var(--ff);letter-spacing:.06em;cursor:pointer}
.dbar{display:flex;align-items:center;justify-content:space-between;margin-top:12px;background:var(--card);border:var(--bd);box-shadow:var(--sh);border-radius:18px;padding:4px}
.dl{font:700 14px var(--ff);text-align:center}.dl::first-letter{text-transform:uppercase}
h2{font:800 12px/1.2 var(--ff);text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin:30px 6px 10px}
.card{background:var(--card);border:var(--bd);box-shadow:var(--sh);border-radius:26px;padding:20px;margin:12px 0}
.big{font:800 40px/1 var(--ff);color:var(--ink);letter-spacing:-.04em}
.big small{font:600 14px var(--ff);color:var(--mut);letter-spacing:0}
.bar{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.bar.over i{background:var(--bad)}
.row{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:600}.row span:last-child{color:var(--mut);font-weight:500;text-align:right}
.f{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 10px}.f .w2{grid-column:span 2}.f .w4{grid-column:span 4}
label{display:block;font:700 12px var(--ff);color:var(--mut);margin:0 0 6px 2px}
input,select{width:100%;height:50px;border:2px solid transparent;border-radius:16px;background:var(--bg2);color:var(--ink);padding:0 14px;font:600 16px var(--ff)}
input::placeholder{color:var(--mut);opacity:.75;font-weight:500}
input:focus,select:focus{border-color:var(--acc);outline:0}
.btn{height:54px;border:0;border-radius:999px;background:var(--acc);color:var(--onacc);font:800 15.5px var(--ff);letter-spacing:-.005em;cursor:pointer;width:100%}
.btn:hover{opacity:.92}.btn:active{transform:scale(.985)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.item b{font-weight:700}.item small{display:block;color:var(--mut);font-size:13px;font-weight:500}
.x{background:none;border:0;color:var(--mut);font-size:22px;width:40px;height:40px;cursor:pointer;border-radius:50%}.x:hover{background:var(--bg2);color:var(--ink)}
.empty{color:var(--mut);padding:4px 0;font-size:14px;font-weight:500}.hint{font-size:13px;color:var(--mut);margin:6px 0 0;min-height:20px}
details summary{cursor:pointer;font-weight:700;font-size:14.5px;min-height:34px;display:flex;align-items:center}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
.chip{height:38px;padding:0 16px;border:0;border-radius:999px;background:var(--chip);color:var(--ink);font:700 13.5px var(--ff);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:color-mix(in srgb,var(--ink) 11%,transparent)}
.chip[aria-pressed="true"]{background:var(--acc);color:var(--onacc)}
.rb{width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:0;cursor:pointer}
.cmp{background:var(--bg2);border-radius:18px;padding:14px;margin:10px 0}.cmp .row{padding:3px 0}
.up{color:var(--ok)}.dn2{color:var(--bad)}.note{font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.45;font-weight:500}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat>div{background:var(--bg2);border-radius:18px;padding:14px}.stat b{display:block;font:800 22px/1.15 var(--ff);color:var(--ink);letter-spacing:-.03em}.stat span{font-size:12px;color:var(--mut);font-weight:600}
.secs{display:grid;gap:12px;margin:18px 0 4px}
.sec{display:grid;grid-template-columns:50px 1fr auto;column-gap:14px;align-items:center;width:100%;text-align:left;padding:18px;border-radius:26px;border:var(--bd);box-shadow:var(--sh);background:var(--card);color:var(--ink);cursor:pointer;font:inherit}
.si{width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 13%,transparent);color:var(--tc)}
.si svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sb{display:flex;flex-direction:column;min-width:0}
.st{font:800 11px var(--ff);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.sn{font:800 28px/1.2 var(--ff);letter-spacing:-.035em}.sn small{font-size:13px;font-weight:600;color:var(--mut);letter-spacing:0;margin-left:5px}
.ss{font-size:13px;color:var(--mut);font-weight:500}
.sm{color:var(--mut)}.sm svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
.sbar{grid-column:1/-1;height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;margin-top:14px}.sbar i{display:block;height:100%;background:var(--tc);border-radius:3px}
.mh{display:flex;justify-content:space-between;align-items:center;margin:0 0 8px}
.ml{font:800 17px var(--ff);letter-spacing:-.02em;padding-left:4px}.ml::first-letter{text-transform:uppercase}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.wd{text-align:center;font:800 11px var(--ff);letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:6px 0}
.day{height:48px;border:0;border-radius:16px;background:transparent;color:var(--ink);font:700 14px var(--ff);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:0}
.day:hover{background:var(--bg2)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.day.today:not([aria-pressed="true"]){box-shadow:inset 0 0 0 2px var(--ink)}
.dots{display:flex;gap:3px;height:5px}.dots i{width:5px;height:5px;border-radius:50%}.dots i.po{border:1.5px solid currentColor;background:none}
.leg{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);font-weight:600}
.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}.leg i.po{border:1.5px solid var(--mut);width:8px;height:8px;box-sizing:border-box}
.in{animation:inn .26s cubic-bezier(.2,.7,.2,1)}
@keyframes inn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.in{animation:none}}
.rw{position:relative;display:grid;place-items:center;flex:none}.rw svg{display:block}.rw .rc{position:absolute;font:800 15px var(--ff);letter-spacing:-.01em}
.rbig{display:flex;align-items:center;gap:20px}.kc{position:absolute;text-align:center;line-height:1.15}.kc b{display:block;font:800 34px/1.05 var(--ff);letter-spacing:-.04em}.kc span{font-size:12px;color:var(--mut)}
.kst{min-width:0}.kst>span:first-child{font-size:12px;color:var(--mut);display:block}.kst b{font:800 28px/1.15 var(--ff);letter-spacing:-.03em;display:block}
.rgs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:22px}
.rg{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}.rg b{font-size:13px;font-weight:700;margin-top:8px}.rg>span{font-size:11.5px;color:var(--mut)}
.cs{display:flex;gap:7px;overflow-x:auto;margin:12px -2px 0;padding:2px;scrollbar-width:none}.cs::-webkit-scrollbar{display:none}.cs .chip{flex:none}
.sel{background:var(--bg2);border-radius:20px;padding:14px;margin:12px 0}.sel .item{border:0}.sel input,.sel select{background:var(--card)}
.prev{font-size:13.5px;margin:12px 0;font-weight:600}
.mh2{display:flex;justify-content:space-between;font:800 11px var(--ff);letter-spacing:.09em;text-transform:uppercase;color:var(--mut);margin:18px 0 2px}.mh2:first-child{margin-top:0}
.scb{display:inline-flex;align-items:center;height:46px;padding:0 20px;cursor:pointer}
.sci{display:grid;grid-template-columns:minmax(0,1fr) 84px 36px;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tag{font:700 11px var(--ff);padding:2px 9px;border-radius:999px;background:var(--chip);color:var(--mut);margin-left:6px;white-space:nowrap}
/* ===== v14 components: nav, arc gauge, tiles, tabs, home ===== */
:root{--runs:#D1173F;--gyms:#2257E0;--macs:#BD3E0B;--arcbg:rgba(28,26,23,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--runs:#A31C42;--gyms:#2B4FB8;--macs:#B4471A;--arcbg:rgba(244,241,234,.1)}}
:root[data-theme="dark"]{--runs:#A31C42;--gyms:#2B4FB8;--macs:#B4471A;--arcbg:rgba(244,241,234,.1)}
.ic.lg{width:24px;height:24px}
/* floating bottom nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;padding:0 14px calc(12px + env(safe-area-inset-bottom,0px));pointer-events:none}
#nav[hidden]{display:none}
.nv{pointer-events:auto;display:flex;align-items:center;justify-content:space-between;gap:2px;width:100%;max-width:500px;height:68px;padding:0 8px;border-radius:28px;background:var(--navbg);color:var(--navink);box-shadow:0 16px 36px -12px rgba(25,14,0,.5)}
.nvb{flex:1;min-width:0;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:color-mix(in srgb,var(--navink) 58%,transparent);font:800 10.5px var(--ff);letter-spacing:.01em;cursor:pointer;padding:0;border-radius:20px;position:relative}
.nvb .ic{width:23px;height:23px;stroke-width:1.9}
.nvb[aria-current="page"]{color:var(--navink)}
.nvb[aria-current="page"] .ic{color:var(--nc,var(--navink))}
.nvb[aria-current="page"]::after{content:"";position:absolute;top:2px;width:18px;height:3px;border-radius:2px;background:var(--nc,var(--navink))}
.nvc{flex:none;width:58px;height:58px;margin:0 6px;border-radius:50%;border:0;background:var(--mac2);color:#1B130E;display:grid;place-items:center;cursor:pointer;padding:0;transform:translateY(-12px);box-shadow:0 0 0 6px var(--bg),0 10px 22px -4px rgba(255,120,50,.55)}
.nvc .ic{width:26px;height:26px;stroke-width:2.6}
.nvc:active{transform:translateY(-12px) scale(.94)}
body.shon #nav{display:none}
body.wk{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
/* hero (kcal arc) */
.hero{padding:20px 20px 18px;position:relative;overflow:hidden}
.hero-hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hero-k{font:800 12px var(--ff);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 13px;border-radius:999px;background:var(--mac3);color:var(--mac);font:800 12.5px var(--ff);border:0;cursor:pointer}
.pill .ic{width:14px;height:14px;stroke-width:2.2}
.pill.run{background:var(--run3);color:var(--run)}.pill.gym{background:var(--gym3);color:var(--gym)}.pill.ghost{background:var(--chip);color:var(--ink)}
.arcw{position:relative;width:100%;max-width:300px;margin:4px auto 0}
.arcw svg{display:block;width:100%;height:auto}
.arcc{position:absolute;left:0;right:0;top:34%;text-align:center;line-height:1.1}
.arcc b{display:block;font:800 46px/1 var(--ff);letter-spacing:-.045em}
.arcc span{display:block;font:700 13px var(--ff);color:var(--mut);margin-top:4px}
.arcc em{display:block;font:800 14px var(--ff);font-style:normal;color:var(--mac);margin-top:8px}
.arcc em.bad{color:var(--bad)}
.m3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2px}
.mt3{background:var(--bg2);border-radius:20px;padding:12px 12px 12px;min-width:0}
.mt3 .mk{display:flex;align-items:center;gap:6px;font:700 11.5px var(--ff);color:var(--mut);white-space:nowrap}
.mt3 .mk i{width:8px;height:8px;border-radius:50%;flex:none}
.mt3 b{display:block;font:800 21px/1.15 var(--ff);letter-spacing:-.03em;margin-top:4px;white-space:nowrap}
.mt3 b small{font:700 12px var(--ff);color:var(--mut);letter-spacing:0}
.mbr{display:block;height:6px;border-radius:3px;background:color-mix(in srgb,var(--ink) 9%,transparent);overflow:hidden;margin-top:8px}.mbr i{display:block;height:100%;border-radius:3px}
.hero-ft{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.hero-ft .go{display:inline-flex;align-items:center;gap:4px;font:800 13.5px var(--ff);color:var(--ink);background:none;border:0;cursor:pointer;padding:6px 0}
.hero-ft .go .ic{width:16px;height:16px;stroke-width:2.2}
/* colored section tiles */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.tl{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0;min-height:176px;padding:18px;border:0;border-radius:28px;color:#fff;cursor:pointer;font:inherit;overflow:hidden;box-shadow:var(--sh)}
.tl.run{background:var(--runs)}.tl.gym{background:var(--gyms)}.tl.mac{background:var(--macs)}
.tl .tk{display:flex;align-items:center;gap:8px;font:800 11.5px var(--ff);letter-spacing:.1em;text-transform:uppercase;opacity:.86}
.tl .tk .ic{width:17px;height:17px;stroke-width:2}
.tl .tn{font:800 38px/1.05 var(--ff);letter-spacing:-.045em;margin-top:14px}
.tl .tn small{font:700 14px var(--ff);letter-spacing:0;opacity:.82;margin-left:4px}
.tl .ts2{font:600 12.5px/1.35 var(--ff);opacity:.86;margin-top:4px}
.tl .tbars{display:flex;align-items:flex-end;gap:5px;height:34px;margin-top:auto;padding-top:12px;width:100%}
.tl .tbars i{flex:1;border-radius:4px;background:rgba(255,255,255,.34);min-height:4px}.tl .tbars i.t{background:#fff}.tl .tbars i.z{background:rgba(255,255,255,.2);min-height:3px}
.tl .live{display:inline-flex;align-items:center;gap:6px;margin-top:auto;font:800 12.5px var(--ff);background:rgba(255,255,255,.2);padding:6px 11px;border-radius:999px}
.tl .live i{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.tl .live i{animation:none}}
/* light tiles */
.tl2{display:flex;flex-direction:column;gap:2px;min-width:0;padding:16px 16px 14px;border:var(--bd);border-radius:26px;background:var(--card);box-shadow:var(--sh);color:var(--ink);text-align:left;font:inherit;cursor:pointer}
.tl2 .tk{display:flex;align-items:center;gap:7px;font:800 11px var(--ff);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.tl2 .tk .ic{width:16px;height:16px;stroke-width:2.1}
.tl2 .tn{font:800 26px/1.15 var(--ff);letter-spacing:-.035em;margin-top:6px}.tl2 .tn small{font:700 12.5px var(--ff);color:var(--mut);letter-spacing:0;margin-left:3px}
.tl2 .ts2{font:600 12.5px/1.35 var(--ff);color:var(--mut)}
/* underline tabs */
.tabs{display:flex;gap:6px;border-bottom:1.5px solid var(--line);margin:14px 0 4px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;padding:10px 12px 12px;font:800 14.5px var(--ff);color:var(--mut);position:relative;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1.5px;height:3.5px;border-radius:3px;background:var(--acc)}
/* generic soft tile + stat row */
.tile{background:var(--bg2);border-radius:20px;padding:14px}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sgrid>div{background:var(--bg2);border-radius:20px;padding:12px 13px;min-width:0}
.sgrid b{display:block;font:800 20px/1.15 var(--ff);letter-spacing:-.03em;white-space:nowrap}.sgrid b small{font:700 12px var(--ff);color:var(--mut);letter-spacing:0}
.sgrid span{display:block;font:600 11.5px/1.3 var(--ff);color:var(--mut);margin-top:2px}
/* race marker + card */
.dots i.rf{width:7px;height:7px;border-radius:2px;background:var(--rc);transform:rotate(45deg)}
.leg i.rf{border-radius:2px;background:var(--rc);transform:rotate(45deg);width:7px;height:7px}
.day[aria-pressed="true"] .dots i.rf{background:var(--rc)}
/* ===== v14 food: diary, meals, water, micros, suggestions, planner, picker ===== */
:root{--wat:#0EA5E9;--mc:#2FA36B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--wat:#38BDF8;--mc:#4CC38F}}
:root[data-theme="dark"]{--wat:#38BDF8;--mc:#4CC38F}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.cta{display:flex;gap:10px;margin:12px 0;align-items:stretch}
.cta .btn{flex:1;width:auto}.cta .ib{width:54px;height:54px;border-radius:20px}
.cta .ib svg{width:21px;height:21px}
/* grams per kg line under the macro tiles */
.gkr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.gkr span{background:var(--bg2);border-radius:16px;padding:9px 12px;font:700 12.5px/1.3 var(--ff);color:var(--mut);min-width:0}
.gkr b{color:var(--ink);font-weight:800;margin-left:3px}
.gkr i{display:block;font:600 11px var(--ff);font-style:normal;color:var(--mut);margin-top:1px}
/* meal / water / micro / suggestion cards */
.card.mc,.card.wcard{padding:14px 16px 10px}
.mc-hd{display:flex;align-items:center;gap:12px}
.mc-ic{width:42px;height:42px;border-radius:14px;background:var(--mac3);color:var(--mac);display:grid;place-items:center;flex:none}
.mc-ic .ic{width:21px;height:21px;stroke-width:1.9}
.mc-ic.wat{background:color-mix(in srgb,var(--wat) 15%,transparent);color:var(--wat)}
.mc-ic.mic2{background:color-mix(in srgb,var(--mc) 15%,transparent);color:var(--mc)}
.mc-ic.mic3{background:color-mix(in srgb,var(--rp) 15%,transparent);color:var(--rp)}
.mc-t{flex:1;min-width:0}
.mc-t b{display:block;font:800 16px/1.25 var(--ff);letter-spacing:-.02em}
.mc-t small{display:block;font:600 12px/1.35 var(--ff);color:var(--mut)}
.mc-k{font:800 19px var(--ff);letter-spacing:-.03em;text-align:right;white-space:nowrap}
.mc-k small{font:700 11px var(--ff);color:var(--mut);letter-spacing:0;margin-left:3px}
.mc-add{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer;padding:0}
.mc-add .ic{width:19px;height:19px;stroke-width:2.5}
.mc-ft{padding:4px 0 6px}
.card.mc>.er:first-of-type,.card.mc>.mc-hd+.er{margin-top:10px}
.er{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line)}
.er-b{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:11px 0;text-align:left;color:inherit;font:inherit;cursor:pointer}
div.er-b{cursor:default}
.er-n{flex:1;min-width:0;display:block}
.er-n b{display:block;font:700 14.5px/1.3 var(--ff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er-n small{display:block;font:600 12px/1.35 var(--ff);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er-k{font:800 15px var(--ff);white-space:nowrap}.er-k small{font:700 11px var(--ff);color:var(--mut);margin-left:2px}
.er .x{flex:none;width:34px;height:34px;font-size:20px}
.chip.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok);width:36px;height:36px;padding:0;justify-content:center;flex:none}
.chip.ok .ic{width:17px;height:17px;stroke-width:2.6}
/* water */
.mbr.thick{height:12px;border-radius:6px;margin-top:14px}.mbr.thick i{border-radius:6px}
.wq{margin:12px 0 8px;flex-wrap:nowrap}.wq .chip{padding:0 12px;gap:4px;flex:none}.wq .chip .ic{width:15px;height:15px}
.wtl{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
.wtag{display:inline-flex;align-items:center;background:color-mix(in srgb,var(--wat) 13%,transparent);border-radius:999px;padding:0 3px 0 12px;height:30px;font:700 12px var(--ff);white-space:nowrap}
.wtag button{border:0;background:none;color:var(--mut);font-size:17px;width:26px;height:26px;border-radius:50%;cursor:pointer;padding:0;line-height:1}
/* micronutrients */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-top:16px}
.mcl{min-width:0}
.mcl-h{display:flex;justify-content:space-between;gap:6px;font:700 12.5px var(--ff);color:var(--mut)}
.mcl-h b{color:var(--ink);font-weight:800;white-space:nowrap}.mcl-h b.bad{color:var(--bad)}
.mcl .mbr{margin-top:6px}
.mcl small{display:block;font:600 11px var(--ff);color:var(--mut);margin-top:4px}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.mchips span{background:var(--bg2);border-radius:12px;padding:6px 10px;font:800 12.5px var(--ff);white-space:nowrap}
.mchips span i{display:block;font:700 10.5px var(--ff);font-style:normal;color:var(--mut);letter-spacing:.02em}
.sel .mchips span{background:var(--card)}
/* suggestions */
.sg{background:var(--bg2);border-radius:20px;padding:14px;margin-top:10px}
.sg-h{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.sg-h b{font:800 14.5px/1.3 var(--ff);letter-spacing:-.01em}.sg-h .tag{margin-left:0}
.sg-m{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font:700 12.5px var(--ff);color:var(--mut)}.sg-m b{color:var(--ink);font-weight:800}
.sg-i{font:600 12.5px/1.5 var(--ff);color:var(--mut);margin-top:6px}
.sg-b{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.sg-b .chip{background:var(--card)}
/* mine */
.mi2{display:block}.mi2 b{display:block;overflow:hidden;text-overflow:ellipsis}
.mi2-b{display:flex;align-items:center;gap:6px;margin-top:10px}.mi2-b .chip{height:36px;padding:0 13px}.mi2-b .x{width:34px;height:34px;font-size:20px;margin-left:auto}
/* planner */
.pstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:4px 0 12px}
.pd{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:var(--bd);background:var(--card);box-shadow:var(--sh);border-radius:18px;padding:8px 0;color:var(--ink);cursor:pointer;font:inherit;min-width:0}
.pd[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pw{font:800 10px var(--ff);letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.pd[aria-pressed="true"] .pw{color:color-mix(in srgb,var(--bg) 72%,transparent)}
.pd b{font:800 16px/1.2 var(--ff)}
.pb{display:block;position:relative;overflow:hidden;width:6px;height:22px;border-radius:3px;background:color-mix(in srgb,currentColor 16%,transparent)}
.pb i{position:absolute;left:0;right:0;bottom:0;border-radius:3px;background:var(--mac2)}
.pd u{position:absolute;top:5px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--mac)}
.pbig{display:flex;align-items:baseline;gap:8px;margin:12px 0 2px;flex-wrap:wrap}
.pbig b{font:800 34px/1 var(--ff);letter-spacing:-.04em}.pbig span{font:700 13px var(--ff);color:var(--mut)}
/* picker sheet */
.shp.fpp{height:90vh;height:90dvh}
.fpp .shc{display:flex;flex-direction:column;flex:1;min-height:0;padding:0;overflow:hidden}
.fps{padding:2px 20px 0;flex:none}
.fpb{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:6px 20px 16px}
.fpf{flex:none;padding:10px 20px 14px;border-top:1px solid var(--line)}
.fsb{position:relative;margin:2px 0 4px}.fsb svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--mut);pointer-events:none}.fsb input{padding-left:44px}
.fpt{margin:6px 0 0;gap:0}.fpt button{flex:1 1 auto;padding:10px 6px 12px;font-size:13.5px}.fpt button[aria-selected="true"]::after{left:6px;right:6px}
.fpr{padding:12px 0;gap:10px}
.fpr>div{flex:1;min-width:0}.fpr b{display:block;font:700 14.5px/1.3 var(--ff)}.fpr small{display:block;color:var(--mut);font:600 12px/1.35 var(--ff)}.fpr>svg{color:var(--mut);width:17px;height:17px}
.fpback{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--chip);border-radius:999px;height:34px;padding:0 14px 0 8px;font:800 13px var(--ff);color:var(--ink);cursor:pointer;margin:2px 0 10px}
.fpback .ic{width:16px;height:16px;stroke-width:2.2}
.stp input{flex:1;min-width:0;width:auto;text-align:center;font:800 18px var(--ff);background:transparent;border:0;height:50px;padding:0}
.stp{border-radius:16px}.stp button{width:52px;height:50px}
.rgi{width:76px;flex:none;height:40px;border-radius:12px;padding:0 10px;font-size:15px;text-align:right}
.rcu{font:700 13px var(--ff);color:var(--mut);margin:0 2px 0 4px}
/* toast sits above the floating nav; on top while a sheet is open (never covers a sheet's buttons) */
#tst{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
body.wk #tst{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
body.rton #tst{bottom:calc(132px + env(safe-area-inset-bottom,0px))}
body.shon #tst{top:calc(12px + env(safe-area-inset-top,0px));bottom:auto}
/* ===== v14 race planner ===== */
.rz{padding:18px}
.rz-hd{display:flex;align-items:center;gap:12px}
.rz-ic{width:42px;height:42px;border-radius:14px;background:color-mix(in srgb,var(--rc) 18%,transparent);color:var(--rct);display:grid;place-items:center;flex:none}
.rz-ic .ic{width:21px;height:21px;stroke-width:1.9}
.rz-t{flex:1;min-width:0}.rz-t b{display:block;font:800 17px/1.25 var(--ff);letter-spacing:-.02em}.rz-t small{display:block;font:600 12.5px/1.35 var(--ff);color:var(--mut)}
.rz-cd{display:flex;align-items:baseline;gap:8px;margin:14px 0 2px;flex-wrap:wrap}
.rz-cd b{font:800 54px/1 var(--ff);letter-spacing:-.05em}.rz-cd b.rz-now{font-size:30px;letter-spacing:-.03em}
.rz-cd span{font:700 14px var(--ff);color:var(--mut)}
.rz-ph{margin-left:auto;font:800 11.5px var(--ff);font-style:normal;letter-spacing:.04em;padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--rc) 18%,transparent);color:var(--rct);align-self:center}
.rz-gs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.rz-g{background:var(--bg2);border-radius:20px;padding:12px 14px;min-width:0}
.rz-g>span{font:800 11px var(--ff);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.rz-g b{display:block;font:800 24px/1.15 var(--ff);letter-spacing:-.03em;margin-top:3px;white-space:nowrap}
.rz-g small{display:block;font:700 12.5px var(--ff);color:var(--mut)}
.rz-g.a{background:color-mix(in srgb,var(--rc) 16%,transparent)}
.rz-g.ok{background:color-mix(in srgb,var(--ok) 15%,transparent)}.rz-g.ok small{color:var(--ok)}
.rz-g.no{background:color-mix(in srgb,var(--bad) 12%,transparent)}.rz-g.no small{color:var(--bad)}
.rz-pr{margin-top:12px;background:var(--bg2);border-radius:20px;padding:12px 14px}
.rz-prh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.rz-prh span{font:800 11px var(--ff);letter-spacing:.09em;text-transform:uppercase;color:var(--mut)}
.rz-prh b{font:800 22px var(--ff);letter-spacing:-.03em}.rz-prh small{font:700 12.5px var(--ff);color:var(--mut)}
.rz-ad{background:var(--bg2);border-radius:18px;padding:12px 14px;margin-top:12px;font:600 13px/1.5 var(--ff)}
.rz-ad b{display:block;font:800 13px var(--ff);margin-bottom:2px}
span.chip.v-reserve,span.chip.v-real,span.chip.v-amb,span.chip.v-hard{cursor:default;height:30px;font-size:12.5px}
.chip.v-reserve,.chip.v-real{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.chip.v-amb{background:color-mix(in srgb,var(--rc) 20%,transparent);color:var(--rct)}
.chip.v-hard{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
/* form */
.rz-ti{display:flex;align-items:center;gap:6px}
.rz-ti input{width:72px;flex:none;text-align:center;padding:0 6px}
.rz-ti i{font:700 13px var(--ff);font-style:normal;color:var(--mut);margin-right:8px}
.rz-pv{font:600 13px/1.6 var(--ff)}.rz-pv b{font-weight:800}
/* next race card (home) */
.rnx{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;color:var(--ink);font:inherit;padding:14px 16px}
.rnx>.ic{color:var(--mut);flex:none;width:18px;height:18px}
.rnx-n{flex:none;width:70px;height:70px;border-radius:22px;background:color-mix(in srgb,var(--rc) 18%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.rnx-n b{font:800 28px/1 var(--ff);letter-spacing:-.04em;display:block}.rnx-n b .ic{width:26px;height:26px;color:var(--rct)}
.rnx-n span{font:800 9.5px var(--ff);text-transform:uppercase;letter-spacing:.07em;color:var(--rct);margin-top:5px;text-align:center}
.rnx-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.rnx-t i{font-style:normal}.rnx-t b{font:800 16.5px/1.25 var(--ff);letter-spacing:-.02em}
.rnx-t small{font:600 12.5px/1.35 var(--ff);color:var(--mut)}
.rnx-t .chip{margin-top:4px}
.rnx0 .rz-ic{width:46px;height:46px;border-radius:16px}
/* list in calendar */
.rzrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0}
.rzrow>div{flex:1;min-width:0}.rzrow b{display:block}
.rzd{flex:none;font:800 12.5px var(--ff);color:var(--rct);background:color-mix(in srgb,var(--rc) 16%,transparent);padding:4px 10px;border-radius:999px}
.rzd:empty{display:none}
/* ===== AI Fitness Twin ===== */
:root{--tw0:#1C1A17;--tw1:#F5F2EB;--tw2:#FF9A66;--tw3:rgba(245,242,235,.28);--twl:rgba(245,242,235,.1);--twm:rgba(245,242,235,.62);--twu:#6EE7A8;--twd:#FF8A7D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tw0:#2B2824;--twl:rgba(245,242,235,.09)}}
:root[data-theme="dark"]{--tw0:#2B2824;--twl:rgba(245,242,235,.09)}
.card.tw{background:var(--tw0);background-image:radial-gradient(110% 70% at 85% -10%,rgba(255,154,102,.26),transparent 62%);color:var(--tw1);border:0;position:relative;overflow:hidden}
.tw-top{display:flex;align-items:center;justify-content:space-between}
.tw-tag,.tw-tag2{display:inline-flex;align-items:center;gap:6px;font:800 11px var(--ff);letter-spacing:.12em;text-transform:uppercase;color:var(--tw2)}
.tw-tag2{color:var(--mac)}
.tw-tag svg,.tw-tag2 svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tw-t1{font:800 25px/1.14 var(--ff);letter-spacing:-.035em;margin:14px 0 4px;text-wrap:balance;color:var(--tw1)}
.tw-sub{font:600 13px var(--ff);color:var(--twm)}
.tw-p{font:500 14px/1.5 var(--ff);color:var(--twm);margin:12px 0 0}
.tw-fig{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:18px 0 4px}
.tw-f{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.tw-f b{font:800 14px var(--ff);margin-top:6px}.tw-f span{font:600 12px var(--ff);color:var(--twm)}
.tw-svg{width:62px;height:116px;display:block;fill:currentColor;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.tw-svg circle{stroke:none}.tw-svg .t{stroke-width:6}.tw-svg .l{fill:none;stroke-width:10}
.tw-svg.g{color:var(--tw1);opacity:.26}.tw-svg.n{color:var(--tw2);filter:drop-shadow(0 8px 20px rgba(255,154,102,.5))}
.tw-f.g b{color:var(--twm)}
.tw-mid{align-self:center;color:var(--tw2);padding-bottom:30px}.tw-mid svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.tw-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.tw-tile{background:var(--twl);border-radius:18px;padding:12px 11px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tw-tile b{font:800 21px/1.1 var(--ff);letter-spacing:-.035em;white-space:nowrap}
.tw-tile.up b{color:var(--twu)}.tw-tile.dn b{color:var(--twd)}
.tw-tile small{font:600 11.5px/1.25 var(--ff);color:var(--twm);overflow-wrap:anywhere}
.tw-ti{color:var(--tw2);margin-bottom:4px;display:block;line-height:0}.tw-ti svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tw .chips.tw-ch{margin:18px 0 6px;flex-wrap:nowrap;gap:6px}.tw-ch .chip{flex:1 1 auto;justify-content:center;padding:0 6px;height:36px;font-size:13px;min-width:0}
.tw .chip{background:var(--twl);color:var(--tw1)}.tw .chip:hover{background:rgba(245,242,235,.18)}
.tw .chip[aria-pressed="true"]{background:var(--tw2);color:#1C1A17}
.tw-sl{margin-top:8px}
.tw-sll{display:flex;justify-content:space-between;gap:10px;font:700 12px var(--ff);color:var(--twm)}.tw-sll b{color:var(--tw1);font-weight:800}
.tw-sl input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:30px;padding:0;margin:4px 0 0;border:0;border-radius:0;background:transparent;--p:0%}
.tw-sl input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--tw2) var(--p),var(--twl) var(--p))}
.tw-sl input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--twl)}
.tw-sl input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--tw2)}
.tw-sl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;background:var(--tw1);border:5px solid var(--tw2);margin-top:-10px;box-shadow:0 3px 10px rgba(0,0,0,.45)}
.tw-sl input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--tw1);border:5px solid var(--tw2);box-shadow:0 3px 10px rgba(0,0,0,.45)}
.tw-sl input[type=range]:focus-visible{outline:2px solid var(--tw2);outline-offset:4px;border-radius:8px}
.tw-slr{display:flex;justify-content:space-between;gap:10px;font:600 11px var(--ff);color:rgba(245,242,235,.5)}
.tw-cta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.tw-ai p{margin:10px 0 0;font:500 14.5px/1.55 var(--ff)}
.tw-aih{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tw-sec{padding-top:16px}
.tw-r{padding:15px 0;border-top:1px solid var(--line)}.tw-r:first-of-type{border-top:0}.tw-sec .note+.tw-r{border-top:0}
.tw-rh{display:flex;justify-content:space-between;align-items:center;gap:10px}.tw-rh b{font:800 15px var(--ff);letter-spacing:-.01em;min-width:0}
.tw-d{flex:none;font:800 12.5px var(--ff);padding:3px 10px;border-radius:999px;background:var(--chip);color:var(--mut);white-space:nowrap}

.rtk{height:42px;padding:0 18px;border:0;border-radius:999px;background:var(--gym2);color:#0B1B44;font:800 14px var(--ff);cursor:pointer}
.rtp{position:absolute;left:0;right:0;bottom:0;height:4px;margin:0;border-radius:0;background:rgba(255,255,255,.12)}.rtp i{background:var(--gym2);border-radius:0}

body.rton #tst{bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.rsn{display:flex;align-items:center;gap:6px;margin:12px 2px 0;font-weight:600}.rsn .ic{width:15px;height:15px}
/* workout logger */
.wst{padding:16px}
.wx{border:0;box-shadow:var(--sh);border:var(--bd);border-radius:28px;padding:16px 14px 12px;margin:12px 0}
.wx.sst{border-left:0;box-shadow:inset 5px 0 0 var(--sc),var(--sh)}
.wxh{min-height:42px}.wxn{font:800 17px/1.25 var(--ff);letter-spacing:-.025em}
.wxm{margin:0 0 10px}
.wsh{font:800 10.5px var(--ff);letter-spacing:.08em}
.ws{border-radius:18px}

.wb{width:34px;height:34px;border-radius:12px;font:800 14px var(--ff)}
.wi{height:44px;border-radius:14px;font:700 16px var(--ff)}
.wc{width:42px;height:42px;border-radius:14px}

.wp{font:600 12.5px var(--ff)}

.gtl{border:var(--bd);box-shadow:var(--sh);border-radius:24px;padding:14px 2px 12px;font:700 12px var(--ff)}
.gti{width:40px;height:40px;border-radius:14px}
.tps{gap:12px;margin:0 -18px;padding:4px 18px 12px}
.tp{width:168px;border:var(--bd);box-shadow:var(--sh);border-radius:26px;padding:16px}
.tp b{font:800 17px/1.25 var(--ff)}.tp.new{border:2px dashed var(--line);box-shadow:none;background:transparent}
.gsl .chip{height:40px}
.plnc{border-radius:24px}

.wl{padding:4px 18px}
.wr,.prt,.prr,.hs{padding:14px 0}

.cst{padding:20px}

.item b{font-weight:700}
.dnb b{font:800 22px var(--ff)}

.btn.ghost{background:var(--chip);color:var(--ink)}

.stat[style*="1fr 1fr 1fr"]>div>span:first-child{font-weight:700}
.row{padding:3px 0}
.card>.item:last-child{padding-bottom:2px}

.bk .btn{display:flex;align-items:center;justify-content:center;gap:8px}.bk .btn .ic{width:18px;height:18px;flex:none}

.bk textarea{width:100%;margin-top:8px;border:0;border-radius:16px;background:var(--bg2);color:var(--ink);padding:12px;font:500 12px/1.4 ui-monospace,Menlo,monospace;resize:vertical;min-height:90px;box-sizing:border-box}
.bkg{border-radius:20px;background:var(--bg2);padding:6px 14px;margin-bottom:12px}

const cwt=k=>Math.min(1,Math.max(.3,(spI(k).m||5)/8)); // intensity weight: a walk or yoga hour counts less than a run hour
function dayInfo(ds){

const clampN=(v,a,b)=>Math.max(a,Math.min(b,v));
function sgSolve(A,B,V,L,tg,lim){

function bkName(){return 'kinetiq-zaloha-'+iso(new Date())+'.json'}

async function bkExport(){
  let txt;try{txt=bkText()}catch(e){toast(t('bkErr'));return}
  if(DLX){try{const r=await DLX.save({filename:bkName(),data:new Blob([txt],{type:'application/json'})});if(r&&r.status==='saved')bkDone()}
    catch(e){const c=e&&e.code;if(c==='declined')return;if(c==='rate_limited'){toast(t('bkWait'));return}bkShowText(txt)}return}
  if(bkInArtifact()){bkShowText(txt);return}
  // standalone app / normal browser: share sheet on phones, download link elsewhere
  try{if(/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)&&navigator.canShare){const f=new File([txt],bkName(),{type:'application/json'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:bkName()});bkDone();return}}}
  catch(e){if(e&&e.name==='AbortError')return}
  try{const u=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=bkName();document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);bkDone()}
  catch(e){bkShowText(txt)}}

  shShow(t('stT'),`<div class="bkg"><div class="bkc"><span>${t('stWk')}</span><b>${r.wk.length}</b><em></em></div><div class="bkc"><span>${t('stSets')}</span><b>${nf(r.ss.length)}</b><em></em></div><div class="bkc"><span>${t('stRange')}</span><b style="grid-column:2/4">${r.from?dstr(r.from,{day:'numeric',month:'numeric',year:'numeric'})+' – '+dstr(r.to,{day:'numeric',month:'numeric',year:'numeric'}):'–'}</b></div><div class="bkc"><span>${t('stCx')}</span><b>${r.newCx.length}</b><em></em></div>${r.dup?`<div class="bkc"><span>${t('stDup')}</span><b>${r.dup}</b><em></em></div>`:''}</div>
  <div class="f" style="margin:0 0 10px"><div class="w4"><label for="stsk">${t('stSkip')} (${r.total})</label><input id="stsk" inputmode="numeric" value="${sk||''}" placeholder="0" onchange="STP.skip=this.value;stPrev()"></div></div>
  ${r.fixed.length?`<div class="note" style="margin:0 0 8px">${t('stFixed').replace('{n}',r.fixed.length)}</div>`:''}
  ${r.nDel||r.nLow||r.nFix?`<div class="note" style="margin:0 0 8px">${t('stClean').replace('{d}',r.nDel).replace('{l}',r.nLow).replace('{f}',r.nFix)}</div>`:''}
  ${r.dropped.length?`<div class="note" style="margin:0 0 8px">${t('stDropped').replace('{n}',r.dropped.length)}</div>`:''}
  ${r.sus.length?`<div class="bkw">${t('stSus')}${li(r.sus,6)}</div>`:''}
  ${r.unk.length?`<div class="bkw">${t('stUnk')}${li(r.unk,8)}</div>`:''}
  <button class="btn" ${r.wk.length?'':'disabled'} onclick="stApply()">${t('stGo').replace('{n}',r.wk.length)}</button>`)}
let stLast=null;
function stApply(){if(!STP||!STP.r)return;const r=STP.r;S.cx=S.cx||[];const addCx=r.newCx.filter(c=>!exOf(c.name)).map(c=>({id:uid(),name:c.name,p:c.p,s:c.s,eq:c.eq,src:'strong'}));
  S.cx.push(...addCx);exC=null;S.wk.push(...r.wk);S.sets.push(...r.ss);stLast={w:r.wk.map(w=>w.id),cx:addCx.map(c=>c.id)};STP=null;
  try{save()}catch(e){}shClose();render();toast(t('stDone').replace('{n}',r.wk.length),{act:t('undo'),fn:'stUndo()',ms:9000})}
function stUndo(){if(!stLast)return;const w=new Set(stLast.w),c=new Set(stLast.cx);S.wk=S.wk.filter(x=>!w.has(x.id));S.sets=S.sets.filter(s=>!w.has(s.wid));S.cx=(S.cx||[]).filter(x=>!c.has(x.id));exC=null;stLast=null;save();render()}
function stHtml(){return `<h2>${t('stH')}</h2><div class="card bk"><div class="bkr"><div class="bki">${IC.upload}</div><div><b>${t('stHead')}</b><span>${t('stDesc')}</span></div></div>
  <button class="btn bkx" style="margin-top:14px" onclick="stPick()">${IC.upload}<span>${t('stBtn')}</span></button>
  <input type="file" id="stf" accept=".csv,text/csv,text/plain" hidden onchange="stFile(this)"></div>`}
Object.assign(I,{stH:['Import','Import'],stHead:['Import ze Strongu','Import from Strong'],
 stDesc:['Nahraj CSV export ze Strongu (Settings → Export Strong Data). Tréninky se přidají k historii, nic se nepřepíše a opakovaný import nevytvoří duplikáty.','Upload the CSV export from Strong (Settings → Export Strong Data). Workouts are added to your history, nothing is overwritten and importing again creates no duplicates.'],
 stBtn:['Vybrat CSV soubor','Choose CSV file'],stT:['Import ze Strongu','Import from Strong'],stWk:['Tréninky k importu','Workouts to import'],stSets:['Série','Sets'],stRange:['Období','Period'],stCx:['Nové vlastní cviky','New custom exercises'],stDup:['Už importované (přeskočím)','Already imported (skipped)'],
 stSkip:['Přeskočit nejstarších tréninků','Skip oldest workouts'],stFixed:['{n}× nesmyslná délka tréninku (zapomenuté vypnutí) → nastavím 60–90 min.','{n}× implausible workout duration (left running) → set to 60–90 min.'],
 stDropped:['{n} sérií bez opakování vynechám.','{n} sets without reps will be skipped.'],stSus:['Podezřele vysoký počet opakování – zkontroluj:','Suspiciously high reps – please check:'],stUnk:['Neznámé cviky (založím jako vlastní):','Unknown exercises (will be added as custom):'],
 stClean:['Úklid podle tvých odpovědí: {d} sérií smazaných cviků, {l} starých sérií na kladce s čísly závaží, {f} opravené překlepy.','Cleanup from your answers: {d} sets of deleted exercises, {l} old cable sets logged as pin numbers, {f} fixed typos.'],stGo:['Importovat {n} tréninků','Import {n} workouts'],stDone:['Importováno {n} tréninků','Imported {n} workouts'],stBad:['Tohle nevypadá jako CSV export ze Strongu','This does not look like a Strong CSV export']});

render();
